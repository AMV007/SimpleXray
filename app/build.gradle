plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version "${kotlin_version}"
    id 'com.google.protobuf' version '0.9.4'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.65.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
            task.plugins {
                grpc {}
            }
        }
    }
}

def versionProps = new Properties()
file("$rootDir/version.properties").withInputStream { versionProps.load(it) }

/**
 * geoip.dat / geosite.dat are not committed (see .gitignore) and are required at
 * runtime: FileManager.extractAssetsIfNeeded() copies them out of assets and
 * crashes the app when they are missing. Download them before the assets are
 * packaged, using the versions pinned in version.properties.
 * The release tag is per-file, so each entry carries its own version.
 */
def rulesDatAssetDir = file('src/main/assets')
def rulesDatFiles = [
        'geoip.dat'  : versionProps.GEOIP_VERSION,
        'geosite.dat': versionProps.GEOSITE_VERSION,
]

def downloadRulesDat = tasks.register('downloadRulesDat') {
    group = 'build setup'
    description = 'Downloads geoip.dat and geosite.dat into src/main/assets.'

    // Stamp of the versions the currently downloaded files were fetched for.
    def versionStamp = new File(rulesDatAssetDir, '.rules-dat-version')
    def wantedStamp = "geoip=${versionProps.GEOIP_VERSION}\ngeosite=${versionProps.GEOSITE_VERSION}\n"

    inputs.property('rulesDatVersions', wantedStamp)

    doLast {
        rulesDatAssetDir.mkdirs()
        def upToDate = versionStamp.exists() && versionStamp.text == wantedStamp
        rulesDatFiles.each { fileName, version ->
            def target = new File(rulesDatAssetDir, fileName)
            if (upToDate && target.exists() && target.length() > 0) {
                logger.lifecycle("${fileName} is up to date, skipping download")
                return
            }
            def url = "https://github.com/lhear/v2ray-rules-dat/releases/download/${version}/${fileName}"
            logger.lifecycle("Downloading ${url}")
            def tmp = new File(rulesDatAssetDir, "${fileName}.tmp")
            new URL(url).openStream().withCloseable { input ->
                tmp.withOutputStream { output -> output << input }
            }
            if (tmp.length() == 0) {
                tmp.delete()
                throw new GradleException("Downloaded ${fileName} is empty: ${url}")
            }
            if (target.exists() && !target.delete()) {
                tmp.delete()
                throw new GradleException("Cannot replace ${target.absolutePath}")
            }
            tmp.renameTo(target)
            logger.lifecycle("Saved ${fileName} (${target.length()} bytes)")
        }
        versionStamp.text = wantedStamp
    }
}

/**
 * libxray.so is the Xray-core binary executed as a child process at runtime. It is
 * gitignored, so a fresh clone builds an APK without it and the core silently
 * fails to start. Provide it automatically, two ways:
 *
 *   -PxrayFromSource   compile Xray-core from source (needs Go + NDK; slow)
 *   default            unpack the official prebuilt android binary from the
 *                      XTLS/Xray-core release (fast, no extra toolchain)
 *
 * Both are pinned to XRAY_CORE_VERSION in version.properties, so switching modes
 * rebuilds the binary when the pinned version changes.
 */
def xrayJniLibsDir = file('src/main/jniLibs')
// abi directory -> release asset suffix / GOARCH used when building from source.
def xrayReleaseAssets = ['arm64-v8a': 'arm64-v8a', 'x86_64': 'amd64']
def xrayGoArches = ['arm64-v8a': 'arm64', 'x86_64': 'amd64']
def xrayArchs = xrayReleaseAssets.keySet()
def xrayFromSource = project.hasProperty('xrayFromSource')
// Stamp that records how the currently present binaries were produced.
def xrayStamp = new File(xrayJniLibsDir, '.xray-core-version')
def xrayWantedStamp = "${versionProps.XRAY_CORE_VERSION} ${xrayFromSource ? 'source' : 'prebuilt'}\n"

def xrayBinariesUpToDate = { String arch ->
    def binary = new File(xrayJniLibsDir, "${arch}/libxray.so")
    return binary.exists() && binary.length() > 0 &&
            xrayStamp.exists() && xrayStamp.text == xrayWantedStamp
}

def downloadXrayCore = tasks.register('downloadXrayCore') {
    group = 'build setup'
    description = 'Unpacks the official Xray-core android binary into src/main/jniLibs.'

    inputs.property('xrayVersion', versionProps.XRAY_CORE_VERSION)
    inputs.property('mode', 'prebuilt')

    doLast {
        if (!xrayFromSource && xrayArchs.every { arch -> xrayBinariesUpToDate(arch) }) {
            logger.lifecycle("libxray.so ${versionProps.XRAY_CORE_VERSION} already present, skipping")
            return
        }
        xrayReleaseAssets.each { arch, releaseArch ->
            if (!xrayFromSource && xrayBinariesUpToDate(arch)) {
                logger.lifecycle("libxray.so (${arch}) is up to date, skipping download")
                return
            }
            def url = "https://github.com/XTLS/Xray-core/releases/download/" +
                    "${versionProps.XRAY_CORE_VERSION}/Xray-android-${releaseArch}.zip"
            logger.lifecycle("Downloading ${url}")
            def workDir = new File(temporaryDir, arch)
            workDir.mkdirs()
            def zip = new File(workDir, 'xray.zip')
            new URL(url).openStream().withCloseable { input ->
                zip.withOutputStream { output -> output << input }
            }
            def unzipDir = new File(workDir, 'unzipped')
            // Xray ships a "xray" executable inside the zip; extract just that entry.
            new java.util.zip.ZipFile(zip).withCloseable { zf ->
                def entry = zf.entries().find { it.name == 'xray' }
                if (entry == null) {
                    throw new GradleException("No 'xray' entry in ${url}")
                }
                unzipDir.mkdirs()
                def binary = new File(unzipDir, 'libxray.so')
                zf.getInputStream(entry).withCloseable { input ->
                    binary.withOutputStream { output -> output << input }
                }
            }
            def targetDir = new File(xrayJniLibsDir, arch)
            targetDir.mkdirs()
            def target = new File(targetDir, 'libxray.so')
            if (target.exists() && !target.delete()) {
                throw new GradleException("Cannot replace ${target.absolutePath}")
            }
            new File(unzipDir, 'libxray.so').renameTo(target)
            if (target.length() == 0) {
                target.delete()
                throw new GradleException("Extracted libxray.so (${arch}) is empty: ${url}")
            }
            logger.lifecycle("Saved libxray.so (${arch}, ${target.length()} bytes)")
        }
        xrayStamp.text = xrayWantedStamp
    }
}

def buildXrayFromSource = tasks.register('buildXrayFromSource') {
    group = 'build setup'
    description = 'Compiles Xray-core from source into src/main/jniLibs (needs Go + NDK).'

    inputs.property('xrayVersion', versionProps.XRAY_CORE_VERSION)
    inputs.property('goVersion', versionProps.GO_VERSION)
    inputs.property('ndkVersion', versionProps.NDK_VERSION)
    inputs.property('mode', 'source')

    doLast {
        if (xrayArchs.every { arch -> xrayBinariesUpToDate(arch) }) {
            logger.lifecycle("libxray.so ${versionProps.XRAY_CORE_VERSION} (source) already present, skipping")
            return
        }
        def goExecutable = System.getenv('GO') ?: 'go'
        try {
            def versionOut = new ByteArrayOutputStream()
            project.exec {
                commandLine goExecutable, 'version'
                standardOutput = versionOut
                ignoreExitValue = true
            }
            if (!versionOut.toString().trim()) {
                throw new GradleException('go is not on PATH')
            }
        } catch (Exception e) {
            throw new GradleException(
                    'Building Xray-core from source requires Go on PATH. ' +
                            'Install Go ' + versionProps.GO_VERSION + ' or drop -PxrayFromSource ' +
                            'to use the official prebuilt binary.', e)
        }

        def sdkDir = android.sdkDirectory
        def ndkDir = new File(sdkDir, "ndk/${versionProps.NDK_VERSION}")
        if (!ndkDir.isDirectory()) {
            throw new GradleException(
                    "NDK ${versionProps.NDK_VERSION} not found at ${ndkDir}. Install it or drop " +
                            '-PxrayFromSource to use the official prebuilt binary.')
        }
        def toolchain = new File(ndkDir, 'toolchains/llvm/prebuilt')
        def hostDir = toolchain.listFiles()?.find { it.isDirectory() }
        if (hostDir == null) {
            throw new GradleException("No LLVM toolchain under ${toolchain}")
        }

        def srcDir = new File(temporaryDir, 'Xray-core')
        def git = { String... args ->
            def out = new ByteArrayOutputStream()
            project.exec {
                commandLine([ 'git' ] + args.toList())
                workingDir = srcDir
                // Keep git chatter out of the normal build output.
                standardOutput = out
            }
            return out.toString().trim()
        }
        if (!new File(srcDir, '.git').isDirectory()) {
            logger.lifecycle("Cloning Xray-core ${versionProps.XRAY_CORE_VERSION}")
            project.exec {
                commandLine 'git', 'clone', '--depth', '1', '--branch',
                        versionProps.XRAY_CORE_VERSION, 'https://github.com/XTLS/Xray-core.git',
                        srcDir.absolutePath
            }
        }
        def commitId = git('rev-parse', 'HEAD').take(7)

        xrayGoArches.each { arch, goArch ->
            if (xrayBinariesUpToDate(arch)) {
                logger.lifecycle("libxray.so (${arch}) is up to date, skipping build")
                return
            }
            def ccName = arch == 'arm64-v8a'
                    ? 'aarch64-linux-android24-clang'
                    : 'x86_64-linux-android24-clang'
            def cc = new File(hostDir, "bin/${ccName}")
            if (!cc.isFile()) {
                throw new GradleException("Android clang not found: ${cc}")
            }
            logger.lifecycle("Building libxray.so for ${arch} (${commitId})")
            def out = new File(temporaryDir, "xray-${arch}")
            project.exec {
                commandLine goExecutable, 'build', '-o', out.absolutePath, '-trimpath', '-buildvcs=false',
                        "-ldflags=-X github.com/xtls/xray-core/core.build=${commitId} -s -w -buildid= -checklinkname=0",
                        '-v', './main'
                workingDir = srcDir
                environment 'GOOS', 'android'
                environment 'GOARCH', goArch
                environment 'CGO_ENABLED', '1'
                environment 'CC', cc.absolutePath
            }
            def targetDir = new File(xrayJniLibsDir, arch)
            targetDir.mkdirs()
            def target = new File(targetDir, 'libxray.so')
            if (target.exists() && !target.delete()) {
                throw new GradleException("Cannot replace ${target.absolutePath}")
            }
            out.renameTo(target)
            logger.lifecycle("Saved libxray.so (${arch}, ${target.length()} bytes)")
        }
        xrayStamp.text = xrayWantedStamp
    }
}

// Only the selected mode runs; the other task stays available for manual use.
def provideXrayCore = xrayFromSource ? buildXrayFromSource : downloadXrayCore

android {
    namespace "com.simplexray.an"
    compileSdk 35

    defaultConfig {
        applicationId "com.simplexray.an"
        versionCode versionProps.APP_VERSION_CODE.toInteger()
        versionName versionProps.APP_VERSION_NAME
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            ndkBuild {
                arguments "APP_CFLAGS+=-DPKGNAME=com/simplexray/an/service -ffile-prefix-map=${rootDir}=."
                arguments "APP_LDFLAGS+=-Wl,--build-id=none"
            }
        }
        targetSdk 35
        minSdk 29
    }

    signingConfigs {
        release {
            enableV1Signing false
            enableV2Signing false
            enableV3Signing true
        }
    }

    def isSigningEnabled = false
    def propsFile = rootProject.file('store.properties')

    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        if (props.containsKey('storeFile')) {
            signingConfigs.release {
                storeFile = rootProject.file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']

                enableV1Signing false
                enableV2Signing false
                enableV3Signing true
            }
            isSigningEnabled = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig isSigningEnabled ? signingConfigs.release : null
            
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
       debug {
            minifyEnabled false
            signingConfig isSigningEnabled ? signingConfigs.release : null
            debuggable true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    ndkVersion versionProps.NDK_VERSION
    kotlinOptions {
        jvmTarget = '1.8'
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def abiFilter = output.getFilter("ABI")
            if (abiFilter != null) {
                output.outputFileName = "simplexray-${abiFilter}.apk"
            } else {
                output.outputFileName = "simplexray-universal.apk"
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'build/generated/source/proto/main/java'
            }
            kotlin {
                srcDirs 'src/main/kotlin', 'build/generated/source/proto/main/grpckt'
            }
        }
    }
}

// Fetch the runtime payload (rule files, Xray-core binary) before it is merged into
// the APK, so a fresh clone builds an APK that does not crash on startup.
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn(downloadRulesDat)
    }
    if (task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) {
        task.dependsOn(provideXrayCore)
    }
}

dependencies {
    implementation "io.grpc:grpc-okhttp:1.74.0"
    implementation "io.grpc:grpc-protobuf:1.74.0"
    implementation "io.grpc:grpc-stub:1.74.0"
    implementation "io.grpc:grpc-kotlin-stub:1.4.3"

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.core:core-ktx:1.16.0'

    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview-android'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.navigation:navigation-compose-android:2.9.3'

    implementation 'com.github.nanihadesuka:LazyColumnScrollbar:2.2.0'
    implementation 'sh.calvin.reorderable:reorderable:2.5.1'
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
