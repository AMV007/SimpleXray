name: "Build"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  release:
    types:
      - published

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: true

      - name: Explicit Submodule Update
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        id: setup_sdk
        uses: android-actions/setup-android@v4
        with:
          # v3 的默认 packages 含已被 SDK 仓库移除的 'tools'，sdkmanager 会 exit 1 导致整步失败。
          # v4 默认改为 platform-tools；这里再显式补齐 compileSdk 35 所需的 platform。
          # build-tools 交给 AGP 按自身默认版本自动补装，避免钉错版本。
          packages: 'platform-tools platforms;android-35'

      - name: Read Versions
        run: |
          echo "GO_VERSION=$(grep 'GO_VERSION' version.properties | cut -d '=' -f 2)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Keystore and Properties
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > ./store.jks
          echo "storeFile=store.jks" > ./store.properties
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> ./store.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> ./store.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> ./store.properties

      # The rule files and the Xray-core binary are not committed. The app module
      # provisions both itself: `downloadRulesDat` runs before the assets are merged
      # and `buildXrayFromSource` before the native libs are merged (it uses the
      # Go and NDK versions pinned in version.properties). No manual fetching.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -PxrayFromSource

      # The renameApksForRelease task writes the release names into
      # outputs/apk/renamed/release, which is what gets published.
      - name: Find and Copy APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/renamed/release/*.apk apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplexray-apks
          path: apks/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "simplexray-*"
          merge-multiple: true

      - name: Upload artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/simplexray-*; do
            gh release upload ${{ github.event.release.tag_name }} $i
          done
